name: TangoDots
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
packages:
  FSRS:
    url: https://github.com/open-spaced-repetition/swift-fsrs.git
    from: 5.0.0
targets:
  TangoDots:
    type: application
    platform: iOS
    sources:
      - path: TangoDots
    dependencies:
      - package: FSRS
        product: FSRS
      - target: TangoDotsWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kade6174.tangodots
        INFOPLIST_FILE: TangoDots/Info.plist
        CODE_SIGN_ENTITLEMENTS: TangoDots/TangoDots.entitlements
        TARGETED_DEVICE_FAMILY: 1
  TangoDotsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TangoDotsWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kade6174.tangodots.widget
        INFOPLIST_FILE: TangoDotsWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: TangoDotsWidget/TangoDotsWidget.entitlements
        TARGETED_DEVICE_FAMILY: 1
  TangoDotsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TangoDotsTests
    dependencies:
      - target: TangoDots
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kade6174.tangodots.tests

